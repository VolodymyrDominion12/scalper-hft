# Щотижневий аудит валідованих pairs (GitHub Actions)
#
# Щопонеділка 06:00 UTC та вручну. Публічні дані без ключів.
# Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.

name: weekly-audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: uv sync --extra optim --extra ml --extra dev

      - name: Юніт-тести
        run: uv run pytest tests/ -q

      - name: Завантажити 1h дані валідованих ніг (365д)
        run: |
          uv run python -m scalper_hft.cli download \
            --symbol BTCUSDT,ETHUSDT,XRPUSDT,LINKUSDT --interval 1h --days 365 --funding

      - name: Аудит pairs XRP/BTC, BTC/ETH, LINK/BTC
        run: |
          uv run python -m scalper_hft.cli pairs --strategy pairs_arb \
            --leg1 XRPUSDT --leg2 BTCUSDT --interval 1h --days 365 --maker --walkforward \
            -p entry_z=2.0 -p exit_z=0.3 -p lookback=480
          uv run python -m scalper_hft.cli pairs --strategy pairs_arb \
            --leg1 BTCUSDT --leg2 ETHUSDT --interval 1h --days 365 --maker --walkforward \
            -p entry_z=2.0 -p exit_z=0.3 -p lookback=240
          uv run python -m scalper_hft.cli pairs --strategy pairs_arb \
            --leg1 LINKUSDT --leg2 BTCUSDT --interval 1h --days 365 --maker --walkforward \
            -p entry_z=2.0 -p exit_z=0.3 -p lookback=240

      - name: Портфель трьох пар
        run: |
          uv run python -m scalper_hft.cli pairs-portfolio --interval 1h --days 365 --position-pct 0.3

      - name: Telegram — OOS / DD / funding wake-up
        if: always()
        run: |
          uv run python - <<'EOF'
          from scalper_hft.backtest.pairs import run_pairs_walk_forward
          from scalper_hft.data.downloader import download_funding, download_klines
          from scalper_hft.live.telegram import send_telegram
          from scalper_hft.strategies.pairs_arb import PairsArb

          specs = [
              ("XRPUSDT", "BTCUSDT", dict(entry_z=2.0, exit_z=0.3, lookback=480)),
              ("BTCUSDT", "ETHUSDT", dict(entry_z=2.0, exit_z=0.3, lookback=240)),
              ("LINKUSDT", "BTCUSDT", dict(entry_z=2.0, exit_z=0.3, lookback=240)),
          ]
          lines = ["Weekly pairs audit"]
          for a, b, p in specs:
              d1 = download_klines(a, "1h", 365)
              d2 = download_klines(b, "1h", 365)
              f1 = download_funding(a, 365)
              f2 = download_funding(b, 365)
              wf = run_pairs_walk_forward(d1, d2, PairsArb(**p), f1, f2, maker_execution=True, position_pct=0.3)
              lines.append(
                  f"{a}/{b}: OOS={wf['avg_oos_sharpe']:+.3f} вікон>0={wf['positive_windows']:.0%} n={wf['n_windows']}"
              )

          high = False
          flines = []
          for sym in ("BTCUSDT", "ETHUSDT", "SOLUSDT"):
              try:
                  f = download_funding(sym, 30)
              except Exception:
                  continue
              r = f["fundingRate"]
              hi = float((r > 0.0001).mean())
              flines.append(f"{sym} >36%річ: {hi:.0%}")
              if hi > 0.05:
                  high = True
          if high:
              lines.append("FUNDING РЕЖИМ ВИСОКИЙ: " + "; ".join(flines))
          send_telegram("\n".join(lines))
          EOF

      - name: Артефакти
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            docs/reports/*.md
            docs/plots/*.png
          if-no-files-found: ignore
