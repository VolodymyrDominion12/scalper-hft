# Швидкі перевірки на PR і push (без мережі Binance / Telegram).
# Щотижневий аудит пар: .github/workflows/weekly-audit.yml

name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Встановити залежності
        run: uv sync --extra dev --extra optim --extra ml

      - name: Ruff
        run: uv run ruff check scalper_hft tests

      - name: Ruff format
        run: uv run ruff format --check scalper_hft tests

      - name: Mypy (non-blocking)
        continue-on-error: true
        run: uv run mypy scalper_hft

      - name: Mypy core live (blocking)
        run: uv run mypy scalper_hft/live/money.py scalper_hft/live/account.py scalper_hft/live/pending_orders.py scalper_hft/live/sync_engine.py scalper_hft/live/pairs_engine.py

      - name: Pytest
        run: uv run pytest tests/ -q
