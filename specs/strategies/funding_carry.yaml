name: funding_carry
version: "1.0"
status: rejected
family: carry

rejection_reason: >
  Виправлено баг з обліком фандінгу (раніше: 480× завищення). Після
  коректного обліку тертя > фандінгу: maker-комісія + slippage на відкриття/
  закриття позиції перевищує накопичений фандінг у поточному low-rate режимі
  (2025–2026). Стратегія може відновитись лише при систематично high-funding
  (> 0.05%/8h = ~54% річних), що нетипово для поточного ринку.

invariants:
  no_lookahead: true
  signal_values: [-1, 0, 1]
  no_nan_output: true
  needs_funding: true

preferred_regimes: ["range", "trend_down"]  # iter7: заробляє ПОЗА бичим режимом

notes: >
  Баг: funding_rate × 480 замість × 3 (8h → день). Виправлено. Після
  виправлення edge зник. Funding carry може бути прибутковим у майбутньому
  bull-cycle — залишаємо як резерв. Референс: docs/funding_regimes.md.
  v1.1 (iter7, 1h × 10 символів × 3y): теги уточнено емпірично —
  `range` (+1.42, 9/10 символів позитивних) і `trend_down` (+2.78, 9/10),
  тоді як `trend_up` — найгірший режим (−3.99, 0/10). Тег `normal`
  (vol-режим) прибрано: він не розділяє PnL і лише розмивав пріор.
  Це ЄДИНА стратегія з додатним mean OOS Sharpe (+0.052, 60% символів) на
  спільній сітці iter7 → роль carry-рукава regime-карти в режимах
  range/trend_down; standalone гейт (SR>0.3) не проходить.
