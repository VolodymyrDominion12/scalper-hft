name: hmm_reversion
version: "1.0"
status: rejected
family: mean_reversion

rejection_reason: >
  HMM-гейт майже повністю вимикає входи: 1 угода за 30 днів (HMM блокує
  ~97% потенційних сигналів). OOS Sharpe −0.05, DSR = 0. Стратегія занадто
  консервативна — гейт не лише захищає від поганих угод, але й прибирає
  більшість потенційно прибуткових. Гіпотеза про "безпечні" HMM-стани не
  підтвердилась — немає значущого edge у відфільтрованих угодах.

invariants:
  no_lookahead: true
  signal_values: [-1, 0, 1]
  no_nan_output: true

preferred_regimes: ["range", "low", "normal"]

notes: >
  HMM-гейтинг залишається корисним як м'який фільтр у pairs_arb (hmm_vol_gate)
  — там блокується лише ~30-40% входів (state 2 з P > 0.6), а не 97%.
  Урок: жорсткий гейт через HMM-стан перетворює стратегію на "ніколи не торгуємо".
