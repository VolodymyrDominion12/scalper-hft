name: supertrend
version: "1.1"
status: rejected
family: momentum

rejection_reason: >
  Edge 1d supertrend з 3-річного вікна (+0.50) не підтвердився при розширенні
  вибірки до 5 років (2021–2026): avg OOS Sharpe −0.151, pos frac 28% (141 угода).
  Прибуток був сконцентрований у 2023–2026 (альт-аптренд), тоді як 2021–2023
  (сидвей та ведмежий ринок 2022) його повністю знищують. На 1h та 4h таймфреймах
  стратегія стабільно збиткова після комісій (4h avg OOS SR −0.55).
  Напрямковий трендовий механізм є період-залежним і не має стабільного edge.
  Референс: docs/reports/iter4_directional.md, docs/STRATEGY_STATUS.md.

params:
  atr_period:
    default: 10
    min: 7
    max: 14
    step: 1
    description: Вікно ATR для розрахунку смуг Supertrend.
  atr_mult:
    default: 3.0
    min: 2.0
    max: 4.0
    step: 0.25
    description: Ширина смуги = atr_mult × ATR.
  atr_mult_sl:
    default: 2.0
    min: 1.5
    max: 3.0
    step: 0.25
    description: SL від ціни входу у множниках ATR.
  atr_mult_tp:
    default: 4.5
    min: 3.0
    max: 7.0
    step: 0.5
    description: TP від ціни входу у множниках ATR.
  volume_factor:
    default: 1.0
    min: 0.8
    max: 1.6
    step: 0.1
    description: Мінімальний об'єм у % від SMA20 для підтвердження входу.
  allow_short:
    default: false
    description: True — шорт-позиція на фліпі вниз; False — вихід з лонга (спотова логіка).

invariants:
  no_lookahead: true
  signal_values: [-1, 0, 1]
  no_nan_output: true

preferred_regimes: ["trend_up"]

notes: >
  Портована з trade-bot-main (supertrend_strategy.py + Indicators.supertrend).
  Відхилена як standalone після 5-річного walk-forward аудиту (iter4), у
  strategy_book занесена як rejected. Залишається як бенчмарк трендових моделей.
  v1.2 (iter7, 1h × 10 символів × 3y): тег `trend_down` ПРИБРАНО — це найгірший
  режим стратегії (Sharpe −4.82, 0/10 символів позитивних), тоді як `trend_up`
  дає +3.96 на 10/10 символів. Механізм: дефолтне `allow_short=false` робить
  стратегію long-only, тож у низхідній структурі вона або поза ринком, або
  тримає лонг проти тренду. Роль у v2.0: bull-рукав regime-карти
  (`docs/reports/strategy_rating_regime.md`), не standalone.
