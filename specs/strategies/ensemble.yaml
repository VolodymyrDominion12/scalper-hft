name: ensemble
version: "1.1"
status: candidate
family: meta

hypothesis: >
  Зважена комбінація кількох альфа-стратегій з різними сім'ями (momentum +
  mean_reversion + relative_value) знижує дисперсію P&L порівняно з будь-якою
  одиничною стратегією. Ваги можуть бути статичними (mode='mean' / 'vote'),
  адаптуватися онлайн через Hedge no-regret алгоритм (mode='hedge', мінімізація regret)
  або масштабуватися за ринковим режимом (mode='regime'). Комбінований Sharpe має
  перевищувати середнє суб-стратегій за рахунок диверсифікації.

edge_conditions:
  - name: diversification_benefit
    description: >
      Std(ensemble_pnl) < mean(std(sub_pnl)) — комбінація знижує волатильність.
  - name: sharpe_beats_average
    description: >
      OOS Sharpe ensemble > середній OOS Sharpe суб-стратегій (принаймні у
      >= 60% walk-forward вікон).

# EnsembleStrategy використовує **kwargs — параметри передаються
# рядком через CLI або через **params dict.
params_doc:
  strategies:
    default: "mean_reversion,ml_strategy"
    description: Список суб-стратегій через кому (формат name:param1=val1:param2=val2).
  mode:
    default: "mean"
    description: >
      Режим комбінування сигналів:
      'mean'   — просте усереднення часток капіталу;
      'vote'   — спільний кворум (всі суб-стратегії мають однаковий знак: +1 якщо всі >0, -1 якщо всі <0, інакше 0);
      'hedge'  — динамічне зважування Hedge/EWA за кумулятивним loss суб-стратегій (Gofer 2014, Ch.2);
      'regime' — м'яке зважування за ринковим станом та taxonomy.preferred_regimes.
  unfavorable_weight:
    default: 0.25
    min: 0.1
    max: 0.5
    step: 0.05
    description: Частка капіталу суб-стратегії у несприятливому ринковому режимі при mode='regime'.
  trend_threshold:
    default: 0.005
    description: Поріг сили тренду для визначення ринкового режиму при mode='regime'.

invariants:
  no_lookahead: true
  signal_values: [-1, 0, 1]  # ensemble кліпує фінальний сигнал до [-1, 1]
  continuous_output_possible: true  # Мета-стратегія повертає безперервні ваги у [-1, 1]
  no_nan_output: true

preferred_regimes: []  # мета-стратегія адаптується до будь-якого режиму

notes: >
  EnsembleStrategy поєднує довільний набір суб-стратегій із REGISTRY.
  Підтримує режими: mean (усереднення), vote (кворум), hedge (Hedge no-regret),
  regime (м'які ваги за таксономією). Для повного онлайн-детектора HMM використовується
  RegimeSupervisor. Потребує OOS-аудиту: чи онлайн-адаптація дає +Sharpe vs static blend.
