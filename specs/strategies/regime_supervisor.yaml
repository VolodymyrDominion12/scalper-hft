name: regime_supervisor
version: "2.2"
status: candidate
family: meta

hypothesis: >
  Ризик-шар, а НЕ перемикач стратегій. Цикл RS (iter15–iter16) показав на holdout
  зі 11 свіжих символів: селекторні політики («режим → стратегія», argmax,
  gap+dwell) НЕ переносяться — на даних, які не використовувались для вибору,
  вони програють incumbent'у (mean per-symbol Sharpe +0.078; «зірка» валідації
  RS-1 gap_dwell@det_mkt дає −0.14 на 4h і +0.39 на 1d проти +1.53 на CORE).
  Натомість МАСШТАБУВАННЯ ЕКСПОЗИЦІЇ за власною волатильністю переноситься:
  рівноважний портфель 5 рукавів з експозицією ×0.25 у режимі vol=high (4h) дає
  port Sharpe +1.156 проти +0.610 в incumbent'а (t_Newey–West +2.01, bootstrap
  CI [+0.05, +2.15], 91% символів > 0, Calmar 0.731 проти 0.362); на тейкерських
  витратах перевага зберігається (ΔSR +0.37) → Tier-2 (risk-overlay).
  Отже edge — у режимно-умовному РОЗМІРІ позиції, а не в режимно-умовному виборі.
  Стара (v2.0) гіпотеза «режим визначає, ЯКА альфа заробляє» відкинута як
  невідтворювана (docs/reports/iter15_regime_supervisor.md,
  docs/reports/iter16_rs2_holdout.md).

edge_conditions:
  - name: regime_conditional_edge_exists
    description: >
      На спільній сітці (10 символів × 1h × 3y, maker, фіксовані дефолти) кожна
      стратегія має режим, де вона додатна на ≥9/10 символах, і режим, де вона
      від'ємна на ≥9/10. iter7: trend_up — supertrend +3.96 (10/10),
      smc_fvg +3.36 (10/10), stoch_rsi +2.77 (10/10); range — funding_carry
      +1.42 (9/10); trend_down — funding_carry +2.78 (9/10); моментум у
      range/trend_down — 0/10 позитивних.
  - name: selector_beats_best_single_oos
    description: >
      Селектор (карта режим→стратегія, навчена на train-фолді, застосована до
      наступного фолду з лагом 1 бар) перевищує best-single, обрану на тому ж
      train-фолді, і рівноважний бленд. iter7: rolling 4 фолди, 30 спостережень
      фолд×символ — selector +2.58 vs best-single −0.40 vs mean-all −0.85;
      selector > best-single у 100% спостережень, selector > 0 у 100%.
  - name: not_data_snooping
    description: >
      CSCV/PBO процедури вибору < 0.5 і DSR селектора > DSR best-single.
      iter7: PBO = 0.004; DSR селектора 0.821 (per-symbol n_trials=27; ≥0.95
      у 6/10 символів), DSR best-single = 0.000. Портфельний n_trials=270
      дає DSR 0.666 → валідація НЕ завершена (потрібен sensitivity + свіжі дані).
  - name: map_not_lookahead
    description: >
      Карта будується лише на періоді, що строго передує періоду застосування
      (fit_days → потім apply), метадані fit-вікна зберігаються у JSON карти;
      у самій стратегії карта є статичним входом (жодного перенавчання на барі).
  - name: risk_overlay_beats_incumbent_on_holdout
    description: >
      [ВИКОНАНО, iter16, Tier-2] blend_mode="risk_overlay" на 4h, заморожений пул
      5 рукавів, на 11 СВІЖИХ символах (holdout): port Sharpe ≥ +0.9 і Δ проти
      incumbent ≥ +0.2 при ≥70% позитивних символів. Факт: +1.156 проти +0.610
      (Δ +0.546), 91% символів > 0, maxDD −0.29% проти −0.46%.
  - name: risk_overlay_statistically_significant
    description: >
      [ЧАСТКОВО, iter16] t_Newey–West(20) ≥ 2.0 і bootstrap CI без нуля на
      validation half. Факт: t = +2.01, CI [+0.05, +2.15] → виконано для CI/t, але
      DSR ≥ 0.95 НЕ досягнуто (потрібен t ≈ 3.4 при n_trials=85) — тому статус
      Tier-2 (paper-моніторинг), а не Tier-1/promotion.
  - name: risk_overlay_survives_costs
    description: >
      [ВИКОНАНО, iter16] Перевага над incumbent'ом зберігається на тейкерських
      витратах (fee 5 bps + slippage). Факт: maker ΔSR +0.546, taker ΔSR +0.37
      (t 1.49, 82% символів > 0).
  - name: selector_claims_refuted
    description: >
      [НЕ ВИКОНАНО — фальсифіковано в iter15/iter16] Селекторні умови вище
      (regime_conditional_edge_exists, selector_beats_best_single_oos,
      not_data_snooping, map_not_lookahead) лишаються в spec як ІСТОРІЯ перевірок,
      але жодна з них не підтвердилась на даних, які не використовувались для
      вибору: переможець RS-1 на 1d `argmax@det_rule` дає mean per-symbol Sharpe
      +0.078 на свіжих символах, «зірка валідації» `gap_dwell@det_mkt` — −0.14
      (4h) / +0.39 (1d). Селекторні режими (regime_soft/best_prior) заборонені
      для paper/live; див. docs/reports/iter15_regime_supervisor.md,
      docs/reports/iter16_rs2_holdout.md.

params_doc:
  strategies:
    default: "supertrend,stoch_rsi,funding_carry"
    description: >
      Суб-стратегії через кому (name:param1=val1:param2=val2). Дефолт v2.0 —
      evidence-based слеви: моментум для trend_up (supertrend, stoch_rsi) +
      carry для range/trend_down (funding_carry). Попередній дефолт
      "mean_reversion,supertrend,hmm_reversion" не мав жодного carry-рукава, і
      mean_reversion/hmm_reversion на 1h практично не торгують (2 та 1 угода за 3 роки).
  blend_mode:
    default: "regime_soft"
    description: >
      risk_overlay | regime_soft | best_prior | contextual_hedge | exp3.
      **risk_overlay** (v2.2, РЕКОМЕНДОВАНИЙ для paper): режимний шар як
      масштабування експозиції — risk-on (vol != high) = рівновага всіх
      суб-стратегій (1/n); risk-off (vol == high) = risk_off_scale × incumbent
      (перша суб-стратегія). Без гістерезису (dwell фальсифіковано, H16-B).
      Валідований конфіг: 4h, пул ts_momentum(long-only),ts_momentum(ls),
      cross_momentum,funding_carry,supertrend, scale 0.25 — Tier-2 на holdout
      (11 свіжих символів: port SR +1.156 vs +0.610 incumbent, t 2.01).
      Дефолт v2.0 = regime_soft лишається для сумісності, але селекторні режими
      (regime_soft/best_prior на taxonomy-пріорах або карті) НЕ валідовані для
      paper/live — див. docs/reports/iter15_regime_supervisor.md.
      contextual_hedge/exp3 — дослідницькі: 80–85 тис. угод (churn).
  risk_off_scale:
    default: 0.25
    min: 0.0
    max: 1.0
    step: 0.05
    description: >
      Експозиція у risk-off режимі для blend_mode="risk_overlay" (множник на
      сигнал incumbent-рукава). Значення 0.25 ЗАМОРОЖЕНО за результатами RS-1/RS-2;
      підбір іншого значення = нова гіпотеза з окремою pre-registration.
  regime_map_path:
    default: ""
    description: >
      Шлях до JSON валідованої карти regime→strategy (RegimeStrategyMap).
      Якщо задано — карта АВТОРИТЕТНА для regime_soft і best_prior; taxonomy-пріори
      (preferred_regimes) не використовуються. Порожньо = працювати на taxonomy
      (дослідницький режим, не рекомендовано для paper/live).
  perf_matrix_path:
    default: ""
    description: >
      Шлях до JSON OOS-матриці (regime × strategy → Sharpe) для
      apply_oos_preferred_regimes: перезаписує preferred_regimes суб-стратегій
      емпіричними тегами (лише для діагностики/логування; на вибір у
      regime_soft/best_prior не впливає, якщо задано regime_map_path).
  n_hmm_states:
    default: 3
    description: Кількість HMM-станів.
  hmm_fit_bars:
    default: 2000
    min: 500
    max: 5000
    step: 500
    description: Перші N барів для causal HMM fit.
  unfavorable_weight:
    default: 0.25
    min: 0.1
    max: 0.5
    step: 0.05
    description: >
      Мінімальна вага суб-стратегії у несприятливому режимі для regime_soft БЕЗ
      карти. З картою не використовується (hard-off = 0 у карті).
  hedge_eta:
    default: null
    description: >
      Швидкість навчання для Hedge у contextual_hedge (null = адаптивний
      розрахунок з варіації loss).
  exp3_gamma:
    default: 0.05
    min: 0.01
    max: 0.2
    step: 0.01
    description: Exploration rate для Exp3Bandit при blend_mode="exp3".
  min_dwell_bars:
    default: 3
    min: 0
    max: 12
    step: 1
    description: >
      Гістерезис structure-режиму: новий режим приймається лише після N
      послідовних барів (0 = вимкнено). Зменшує churn перемикань на фліпах
      range↔trend. Дефолт v2.0 = 3 (гістерезис без втрати OOS: iter7 dwell3 ≈ dwell0).
  vol_high_veto:
    default: false
    description: >
      True — позиція 0 у режимі волатильності high (вибухові рухи ≠ стабільний
      короткий edge; захист від momentum-crash і комісійного бюджету).
      iter2: на 1h-структурі гейт не покращує OOS (залишається opt-in).
  trend_direction_gate:
    default: false
    description: >
      True — у trend_up заборонені шорти, у trend_down — лонги (не торгуємо
      проти явного тренду; range — без обмежень). iter2: на 1h суттєво гірше.
  lazy_gating:
    default: false
    description: >
      True — сигнал суб-стратегії занулюється, якщо її preferred_regimes не
      перетинаються з поточним режимом («виконуються лише стратегії активного
      режиму»). Працює лише на taxonomy-тегах; з regime_map_path зайве.
  turnover_penalty:
    default: 0.0
    min: 0.0
    max: 0.001
    step: 0.0001
    description: Штраф за |Δsignal| у навчанні contextual_hedge/exp3 (net-PnL-свідоме навчання).
  htf_tf:
    default: ""
    description: >
      Старший таймфрейм для structure (напр. "1d") замість same-TF EMA-cross;
      порожньо = локальна структура. Каузально (лише закриті htf-вікна) —
      iter3: 1h/4h-структура запізнюється відносно тренду старшого ТФ.

invariants:
  no_lookahead: true
  signal_values: [-1, 0, 1]  # ціль після clip; мета-стратегія може повертати float
  continuous_output_possible: true  # regime_soft/contextual_hedge повертають float
  no_nan_output: true
  map_static_input: true  # карта режим→стратегія не перенавчається на барах

preferred_regimes: []

notes: >
  v2.1 (2026-09-12, цикл RS): доданий чесний вердикт iter15 і заборона промоції
  селекторного режиму до проходження Tier-1.
  РЕЗУЛЬТАТ RS-1 (docs/reports/iter15_regime_supervisor.md):
  (1) на 1d/4h/1h з вибором політики ЛИШЕ на selection half (лаг на РІШЕННІ,
  вартість re-weighting віднімається) жодна з 7 політик не проходить Tier-1;
  найкращий near-miss — risk-scaling на 4h (`riskoff_anchor@det_vol`): val SR
  +0.963 проти incumbent +0.721 (Δ+0.24, 14/15 символів >0), але t=1.72 і DSR=0;
  (2) «зірка валідації» 1d `gap_dwell@det_mkt` (val SR +1.53, t 2.14, PBO 0.071)
  має Sharpe −0.09 на selection half → артефакт відбору, не edge; taxonomy-карта
  і argmax-перемикання лишаються невалідованими;
  (3) 1h повністю збитковий (val SR −0.92) — підтверджує економіку ТФ;
  (4) |IC| детекторів ≈0.02 → стан не передбачає відносний PnL рукавів.
  НАСТУПНИЙ КРОК: RS-2 (docs/reports/hypothesis_iter16_rs2.md) — holdout на 11
  свіжих символах + risk-off overlay з асиметричним гістерезисом; лаг-тест
  `experiments/iter15_regime_supervisor_cycle.py --selfcheck`.

  v2.0 (2026-09-11, iter7): карта «режим → стратегія» стала ЕМПІРИЧНОЮ.
  Зміни проти v1.4: (1) regime_map_path авторитетний для regime_soft і best_prior
  (taxonomy-пріори обходяться); (2) дефолтний пул дітей —
  supertrend,stoch_rsi,funding_carry (додано carry-рукав); (3) дефолт
  blend_mode = regime_soft та min_dwell_bars = 3.
  Діагностика v1.4 (чому попередня версія була збиткова на 1h, 10 символів):
  усі blend_mode дали від'ємний mean OOS Sharpe (−0.150…−0.204 для
  ensemble/supervisor, −0.469 для exp3) і не перевершили найкращу одиночну
  стратегію; причини — taxonomy-пріори суперечили даним, порожній
  preferred_regimes вироджував best_prior, пул дітей не мав carry.
  Побудова карти: `python -m scalper_hft.cli regime-map --strategies ... --symbols ...
  --fit-days N --out results/regime_map.json` (фіксує fit-вікно у метаданих).
  Референси: docs/reports/strategy_rating_regime.md, docs/reports/iter7_tables.md,
  docs/reports/iter15_regime_supervisor.md, docs/reports/regime_supervisor_research.md.
  ЗАБОРОНА: не використовувати селекторний режим (regime_soft/best_prior на
  taxonomy-пріорах) для paper/live без проходження Tier-1 у циклі RS.
