name: regime_supervisor
version: "1.3"
status: candidate
family: meta

hypothesis: >
  Детектор ринкового режиму (HMM + rule-based структура + волатильність)
  дозволяє динамічно зважувати суб-стратегії пропорційно їх теоретичній
  відповідності поточному режиму. Онлайн-адаптація ваг (ContextualHedgeBlend)
  швидше реагує на концепт-дрейф ніж статичне blending. Комбінований Sharpe
  перевищує будь-яку суб-стратегію у всіх режимах — не через кращий signal,
  а через кращий режим-гейтинг. Гістерезис структури (min_dwell_bars) і
  жорсткий per-regime вибір (best_prior) зменшують churn ваг на фліпах
  range↔trend (дослідження: min-dwell ріже режимний churn на ~68%).

edge_conditions:
  - name: regime_detection_accuracy
    description: >
      Детектор режиму правильно класифікує > 60% барів порівняно з
      ретроспективним labels (структура: EMA cross; vol: percentile).
  - name: contextual_hedge_improvement
    description: >
      ContextualHedgeBlend показує >= 10% вищий Sharpe vs рівних ваг (equal_weight)
      у >= 2 з 3 walk-forward вікон.
  - name: dwell_reduces_turnover
    description: >
      min_dwell_bars>0 зменшує кількість змін режиму і turnover сигналу без
      погіршення avg OOS Sharpe у walk-forward (порівняно з min_dwell_bars=0).

# regime_supervisor використовує **kwargs — параметри передаються рядком.
# Параметри задекларовані як документація, але НЕ перевіряються у param_space.
params_doc:
  strategies:
    default: "mean_reversion,supertrend,hmm_reversion"
    description: Список суб-стратегій через кому (name:param1=val1:param2=val2).
  blend_mode:
    default: "contextual_hedge"
    description: regime_soft | contextual_hedge | best_prior | exp3
  n_hmm_states:
    default: 3
    description: Кількість HMM-станів.
  hmm_fit_bars:
    default: 2000
    min: 500
    max: 5000
    step: 500
    description: Перші N барів для causal HMM fit.
  unfavorable_weight:
    default: 0.25
    min: 0.1
    max: 0.5
    step: 0.05
    description: Мінімальна вага суб-стратегії у несприятливому режимі.
  min_dwell_bars:
    default: 0
    min: 0
    max: 12
    step: 1
    description: >
      Гістерезис structure-режиму: новий режим приймається лише після N
      послідовних барів (0 = вимкнено). Зменшує churn ваг/стратегій на
      фліпах range↔trend.
  vol_high_veto:
    default: false
    description: >
      True — позиція 0 у режимі волатильності high (вибухові рухи ≠ стабільний
      короткий edge; захист від momentum-crash і комісійного бюджету).
  trend_direction_gate:
    default: false
    description: >
      True — у trend_up заборонені шорти, у trend_down — лонги (не торгуємо
      проти явного тренду; range — без обмежень).
  htf_tf:
    default: ""
    description: >
      Старший таймфрейм для structure (напр. "1d") замість same-TF EMA-cross;
      порожньо = локальна структура. Каузально (лише закриті htf-вікна) —
      iter3: 1h/4h-структура запізнюється відносно тренду старшого ТФ.

invariants:
  no_lookahead: true
  signal_values: [-1, 0, 1]  # ціль після clip; мета-стратегія може повертати float
  continuous_output_possible: true  # regime_soft/contextual_hedge повертають float
  no_nan_output: true

preferred_regimes: []

notes: >
  RegimeSupervisor є розширеним EnsembleStrategy з явним RegimeDetector.
  Чотири blend_mode: "regime_soft" (статичні ваги за taxonomy), "contextual_hedge"
  (онлайн per-regime Hedge), "best_prior" (жорсткий вибір ОДНІЄЇ стратегії з
  найвищим taxonomy-пріором у поточному режимі — нативний сигнал {-1,0,1}),
  "exp3" (Exp3Bandit — вибирає одну найкращу стратегію).
  Потребує спільного аудиту з суб-стратегіями (тест: чи supervisor > best sub-strategy).
