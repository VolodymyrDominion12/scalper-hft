[project]
name = "scalper-hft"
version = "0.1.0"
description = "Високочастотна скальпінг-система для Binance USDT-M ф'ючерсів: дані, фічі, стратегії, бектест з анти-перенавчанням, ML, paper/live торгівля."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "ccxt>=4.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "tabulate>=0.9",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
optim = [
    "optuna>=3.6",
]
ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]
dashboard = [
    "streamlit>=1.30",
]
live = [
    "websockets>=12",
    "python-telegram-bot>=20.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scalper_hft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["scalper_hft", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
"scalper_hft/dashboard.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = false
files = ["scalper_hft"]
ignore_missing_imports = true

[tool.uv]
package = true
