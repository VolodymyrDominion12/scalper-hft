# PostgreSQL для кешування ринкових даних (klines / aggTrades / funding).
#
# Запуск:
#   docker compose up -d postgres  # лише PostgreSQL
#   docker compose up -d           # PostgreSQL + pgAdmin
#   docker compose ps              # перевірити healthcheck
#
# pgAdmin UI:
#   URL:      http://localhost:5050
#   Email:    admin@scalper.com (або ${PGADMIN_DEFAULT_EMAIL})
#   Password: scalper (або ${PGADMIN_DEFAULT_PASSWORD})
#   Host підключення в pgAdmin: postgres, Port: 5432
#
# Потім укажи в .env:
#   DATA_BACKEND=postgres
#   POSTGRES_HOST=localhost
#   POSTGRES_PORT=5436
#
# Схема створюється автоматично при першому підключенні (store.ensure_schema).
# Об'єм зберігається у docker volume `postgres_data` — дані переживають
# перезапуск контейнера.

services:
  postgres:
    image: postgres:16-alpine
    container_name: scalper_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scalper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scalper}
      POSTGRES_DB: ${POSTGRES_DB:-scalper}
    ports:
      # зовнішній порт за замовчуванням 5436 (5432/5433/5434 часто зайняті)
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scalper} -d ${POSTGRES_DB:-scalper}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: scalper_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@scalper.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-scalper}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:

